<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Akshat - WEB DEVELOPER, builder and music enthusiast.">
  <title>Akshat - WEB DEVELOPER & Music</title>
  <link rel="icon" type="image/png" href="Assets/favicon.png">

  <style>
    /* ==========================================
       1. BASE & RESET STYLES
       ========================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none; /* Default cursor hide karne ke liye */
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 200vh; /* Scroll test karne ke liye */
      overflow-x: hidden;
      position: relative;
    }

    /* ==========================================
       2. GLOW & CURSOR STYLES
       ========================================== */
    .glow-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: radial-gradient(
        600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(50, 102, 241, 0.15),
        transparent 80%
      );
      z-index: 1;
      transition: background 0.01s ease-out;
    }

    .cursor-dot {
      position: fixed;
      width: 8px;
      height: 8px;
      background-color: #a3b8fb;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px #a3b8fb, 0 0 20px #a3b8fb;
    }

    .cursor-trail {
      position: fixed;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(50, 102, 241, 0.4);
      background-color: rgba(50, 102, 241, 0.05);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(50, 102, 241, 0.3);
      transition: transform 0.15s ease-out, width 0.2s ease, height 0.2s ease;
    }

    body.hovered .cursor-trail {
      width: 50px;
      height: 50px;
      background-color: rgba(50, 102, 241, 0.15);
      border-color: rgba(50, 102, 241, 0.8);
    }

    /* ==========================================
       3. SAMPLE CONTENT LAYOUT
       ========================================== */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .btn {
      padding: 12px 28px;
      background: linear-gradient(135deg, #3266f1, #1e40af);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(50, 102, 241, 0.5);
    }
  </style>
</head>
<body>

  <!-- Background Glow Effect Element -->
  <div class="glow-bg"></div>

  <!-- Custom Cursor Elements -->
  <div class="cursor-dot"></div>
  <div class="cursor-trail"></div>

  <!-- Main Website Content -->
  <main>
    <section class="hero">
      <h1>Welcome to Akshat's Corner</h1>
      <p>WEB DEVELOPER, Builder and Music Enthusiast</p>
      <button class="btn" role="button">Explore Work</button>
    </section>
  </main>

  <!-- ==========================================
       4. JAVASCRIPT LOGIC
       ========================================== -->
  <script>
    console.log("%c Hey 👋", "font-size: 25px; font-weight: bold;");
    console.log("Welcome to Akshat's corner of the internet.");

    // DOM Elements Selectors
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorTrail = document.querySelector('.cursor-trail');
    const glowBg = document.querySelector('.glow-bg');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let trailX = mouseX;
    let trailY = mouseY;

    // Mouse Movement Event Listener
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      // Update Cursor Dot Position
      if (cursorDot) {
        cursorDot.style.left = `${mouseX}px`;
        cursorDot.style.top = `${mouseY}px`;
      }

      // Update Background Glow Position
      if (glowBg) {
        glowBg.style.setProperty('--mouse-x', `${mouseX}px`);
        glowBg.style.setProperty('--mouse-y', `${mouseY}px`);
      }
    });

    // Smooth Trail Animation
    function animate() {
      trailX += (mouseX - trailX) * 0.15;
      trailY += (mouseY - trailY) * 0.15;

      if (cursorTrail) {
        cursorTrail.style.left = `${trailX}px`;
        cursorTrail.style.top = `${trailY}px`;
      }

      requestAnimationFrame(animate);
    }
    animate();

    // Interactive Hover Elements (Buttons, Links, etc.)
    const interactiveElements = document.querySelectorAll('button, a, input, [role="button"]');
    interactiveElements.forEach((el) => {
      el.addEventListener('mouseenter', () => {
        document.body.classList.add('hovered');
      });
      el.addEventListener('mouseleave', () => {
        document.body.classList.remove('hovered');
      });
    });
  </script>

</body>
</html>
